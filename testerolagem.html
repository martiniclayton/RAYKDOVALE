<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Aparecendo Um por Um</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 0;
            background-color: #121212;
            color: white;
        }

        #containerRolagem {
            width: 1000px;
            border: 2px solid red;
            padding: 40px;
            margin-bottom: 200px;
            display: flex;
            flex-direction: column;
            /* Damos espaço entre os pontos de scroll para cada card ter seu momento */
            gap: 400px; 
        }

        .card {
            /* Faz o card grudar ao rolar */
            position: sticky;
            top: 100px;
            
            width: 300px;
            height: 350px;
            background-color: #efc679;
            color: #000;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 -10px 20px rgba(0, 0, 0, 0.5);

            /* 1. ESTADO INICIAL: ESCONDIDO E DESLOCADO */
            opacity: 0;
            transform: translateY(100px) scale(0.9);
            /* Transição suave para quando ele aparecer */
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 2. ESTADO VISÍVEL: Quando o JS adiciona a classe .revelado */
        .card.revelado {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>

    <main>
        <section id="containerRolagem">
            <div class="conteudoA">
                <h2>Role para ver os cards surgirem um por um 👇</h2>
            </div>

            <!-- Todos iniciam escondidos pelo CSS -->
            <div class="card">
                <h2>Card 1</h2>
                <p>Eu apareço primeiro!</p>
            </div>

            <div class="card">
                <h2>Card 2</h2>
                <p>Eu só apareço quando você rolar até aqui!</p>
            </div>

            <div class="card">
                <h2>Card 3</h2>
                <p>Eu fico sobreposto aos outros.</p>
            </div>

            <div class="card">
                <h2>Card 4</h2>
                <p>E eu sou o último a surgir!</p>
            </div>
        </section>

        <!-- Espaço no final para poder rolar a página até o fim -->
        <div style="height: 500px;"></div>
    </main>

    <script>
        // Cria o observador que detecta a rolagem até o elemento
        const observador = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                // Se o card chegou na área de visão, adiciona a classe para revelar
                if (entry.isIntersecting) {
                    entry.target.classList.add('revelado');
                } else {
                    // Opcional: Esconde de novo se você rolar para cima
                    entry.target.classList.remove('revelado');
                }
            });
        }, {
            threshold: 0.2 // Revela quando 20% do card entrar na tela
        });

        // Seleciona todos os cards e coloca para vigiar
        document.querySelectorAll('.card').forEach(card => {
            observador.observe(card);
        });
    </script>
</body>
</html>
