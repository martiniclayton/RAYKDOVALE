<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayk do Vale Construtora</title>
    <link rel="icon" type="image/png" href="icon/iconeRVC.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/btn-text-sombras-var.css">

    <style>

        :root{
            --cor-principal: white;
            --cor-secundaria: black;
            --cor-rgbaP: rgba(255, 255, 255, 0.8);
            --cor-hoverbuttn: rgba(255, 255, 255, 0.3);
            
        }
        #CTA{
            background: var(--cor-secundaria);
            color: var(--cor-principal);
            font-family: 'Inter', sans-serif;;
        }
        .container-CTA{
            max-width: 500px;
        }

        .container-CTA  h1{
            font-size: clamp(3rem, 4vw, 4.5rem);
            font-weight: 600;
        }

        .container-CTA p{
            color: var(--cor-rgbaP)

        }
        .container-CTA button{
            width: 200px;
            padding: 10px;
            background-color: transparent;
            color: var(--cor-principal);
            border: 1px solid var(--cor-principal);
            transition: .3s ease;
        }

        .container-CTA button:hover{
            background-color: var(--cor-hoverbuttn)
        }

    </style>

</head>
<body>

    <section id="CTA">
        <div class="container py-5">
            <div class="row text-center d-flex justify-content-center paddingMobile">
                <div class="container-CTA">
                    <h1>Vamos construir seu projeto?</h1>
                    <p>Nossa equipe técnica está pronta para analisar seu projeto arquitetônico e fornecer um orçamento detalhado com cronograma de execução.</p>
                    <button class="">Solicitar Orçamento</button>
                </div>
            </div>
        </div>
    </section>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
