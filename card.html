    <style>
        .container-card{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card{
            width: 300px;
            margin: auto;
        }

        .box-card{
            display: grid;
            grid-template-rows: auto 1fr auto;
            align-items: stretch;
            height: 100%;
            width: 100%;
            padding: 20px;
            overflow-wrap: break-word;
            word-break: break-word;
            border: 1px solid red;
        }
        
        .conteudo{
            display: grid;
            grid-template-rows: subgrid;
            grid-row: span 3;
        }

        .conteudo .titulo-card{
            grid-row: 1;
        }

        .conteudo .descricao-card{
            grid-row: 2;
        }

        .conteudo .btn-card{
            grid-row: 3;
        }
    </style>
