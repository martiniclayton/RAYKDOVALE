<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards Empilháveis</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background-color: #121212;
      color: white;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      /* Espaço no final para permitir rolar após o último card */
      padding-bottom: 300px; 
    }

    h1 {
      text-align: center;
      margin-bottom: 50px;
    }

    /* ESTILO DOS CARDS */
    .card {
      /* 1. Torna o elemento "grudado" durante a rolagem */
      position: sticky;
      
      /* 2. Define a distância do topo onde ele vai travar */
      top: 100px;

      /* Estilo visual dos cards */
      height: 300px;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 40px; /* Distância original entre eles antes de empilhar */
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Cores e variações para diferenciar cada card */
    .card-1 {
      background-color: #ff595e;
    }

    .card-2 {
      background-color: #ffca3a;
      color: #121212;
    }

    .card-3 {
      background-color: #8ac926;
      color: #121212;
    }

    .card-4 {
      background-color: #1982c4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Role a página 👇</h1>

    <div class="card card-1">
      <h2>Card 1</h2>
      <p>Eu vou travar no topo quando a página rolar.</p>
    </div>

    <div class="card card-2">
      <h2>Card 2</h2>
      <p>Eu vou subir e passar por cima do Card 1.</p>
    </div>

    <div class="card card-3">
      <h2>Card 3</h2>
      <p>Eu vou sobrepor o Card 2.</p>
    </div>

    <div class="card card-4">
      <h2>Card 4</h2>
      <p>E eu fecho a pilha!</p>
    </div>
  </div>

</body>
</html>
