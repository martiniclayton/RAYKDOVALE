
<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        :root{
            --cor-primaria: white;
            --cor-secundaria: black;
        }

        body.travar{
            overflow: hidden;
        }

        button:focus-visible, a:focus-visible{
            border: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: none !important;
            font-weight: bold;
        }
        .divLogoFecharMenu{
            display: flex;
            justify-content: space-between;
        }
        #header{
            position: fixed;
            width: 100%;
            top: 0;
            background-color: transparent;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: .3s ease;

            animation: entradaheader .8s ease;
        }

        @keyframes entradaheader {
            from{
                top: -100%;
            }
            to{
                top: 0;
            }
        }

        #header #menuNavbar a{
            color: var(--cor-primaria);
        }

        #header #menuNavbar a.ativo{
            opacity: .7;
            cursor: default;
        }

        #header #menuNavbar a:hover{
            opacity: .7;
        }


        #header #menuNavbar .btn-orcamento{
            color: var(--cor-primaria);
            border: 1px solid var(--cor-primaria);
            border-radius: 0;
        }

        #header #menuNavbar .btn-orcamento:hover{
            background-color: var(--cor-primaria);
            color: black;
            border-radius: 0;
        }

        #header.branco{
            background-color: var(--cor-primaria);
        }

        #header.branco #menuNavbar a{
            color: var(--cor-secundaria);
        }


        #header.branco #menuNavbar .btn-orcamento{
            color: var(--cor-secundaria);
            border: 1px solid var(--cor-secundaria);
        }

        #header.branco #menuNavbar .btn-orcamento:hover{
            background-color: var(--cor-secundaria);
            color: var(--cor-primaria);
            border-radius: 0;
        }

        .navbar-toggler{
            border-color: var(--cor-primaria);
        }

        .navbar-toggler:focus{
            box-shadow: none;
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 255, 255, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        #header.branco .navbar-toggler{
            border-color: var(--cor-secundaria);
        }

        #header.branco .navbar-toggler-icon{
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 0, 0, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        #logoToggle{
            display: none;
        }

        #fecharToggle{
            display: none;
        }

        .hidden{
            display: none;
        }

        @media (max-width: 900px) {
            #logoToggle{
                display: block;
            }
            #overlayToggle{
                display: none;
                background-color: rgba(0, 0, 0, 0.6);
                position: absolute;
                opacity: 0;
                z-index: 3;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                transition: .2s ease-out;
            }
            #overlayToggle.show{
                display: block;
                opacity: 1;
            }
            #menuNavbar{
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                max-width: 400px;
                height: 100vh;
                padding: 19px 29px;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        
                /* 2. ACELERAÇÃO DE HARDWARE: Força a GPU a processar a     animação */
                will-change: transform;
                display: block;
                background-color: var(--cor-primaria);
                z-index: 0;
            }
            #menuNavbar.sombra{
                box-shadow: 5px 0 8px rgba(0, 0, 0, 0.4);
            }
            #menuNavbar.show{
                transform: translateX(0%);
            }

            #fecharToggle{
                position: absolute;
                right: 10px;
                display: block;
            }
            #btn-toggleMenu{
                width: 30px;
                font-size: 20px;
                cursor: pointer;
                text-align: center;
                border-color: var(--cor-secundaria);
            }

            #btn-toggleMenu .navbar-toggler-icon {
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 0, 0, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
            }
            #header{
            }

            #header #menuNavbar a{
                color: var(--cor-secundaria);
            }

            #header #menuNavbar a.ativo{
                opacity: .7;
                cursor: default;
            }

            #header #menuNavbar a:hover{
                opacity: .7;
            }

            #header #menuNavbar .btn-orcamento{
                color: var(--cor-secundaria);
                border: 1px solid var(--cor-secundaria);
                border-radius: 0;
            }

            #header.branco #menuNavbar .btn-orcamento:hover{
                background-color: var(--cor-secundaria);
                color: black;
                border-radius: 0;
            }
        }

        @media (max-width: 450px) {
            #logo{
                width: 200px;
            }
            #menuNavbar{
                box-shadow: none;
            }
        }

        #hero{
            width: 100%;
            background-image: url(img/scene-construction-site-with-equipment.jpg);
            background-position: center;
            background-size: cover;
            position: relative;
        }

        #hero .overlay{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
    </style>
</head>

    <script>
        const header = document.getElementById("header");
        const logo = document.getElementById("logo");

        function atualizarHeader(){
            if(menuNavbar.classList.contains("show")){
                NavPreto();
                btnToggle.classList.add("hidden");
            }else{
                if(window.scrollY > 50){
                    NavBranco();
                }else{
                    NavPreto();
                }
            }
        }

        window.addEventListener("scroll", ()=>{
            atualizarHeader();
        })

        function NavBranco(){
            header.classList.add("branco");
            logo.src = "img/logoPreto.png";
        }

        function NavPreto(){
            header.classList.remove("branco");
            logo.src = "img/logoBranco.png";
        }

        // window.addEventListener("scroll", ()=>{
        //     if(window.scrollY > 50){
        //         NavBranco();
        //     } else{
        //         NavPreto();
        //     }
        // })

        const btnToggle = document.getElementById("btn-toggle");
        const menuNavbar = document.getElementById("menuNavbar");
        const overlayToggle = document.getElementById("overlayToggle");
        const btnToggleMenu = document.getElementById("btn-toggleMenu");


        btnToggle.addEventListener("click", abrirToggle);
        btnToggleMenu.addEventListener("click", fecharToggle);

        function abrirToggle(){
            menuNavbar.classList.toggle("show");
            overlayToggle.classList.toggle("show");
            btnToggle.classList.add("hidden");
            menuNavbar.classList.add("sombra");
            document.body.classList.add("travar");
            NavPreto();
        }

        function fecharToggle(){
            menuNavbar.classList.remove("show");
            menuNavbar.style.boxShadow = "none";
            overlayToggle.classList.remove("show");
            btnToggle.classList.remove("hidden");
            menuNavbar.classList.remove("sombra");
            document.body.classList.remove("travar");


        }


        /// evento fechar no click

        window.addEventListener("click",(e)=>{
            if(!menuNavbar.contains(e.target) && !btnToggle.contains(e.target) && menuNavbar.classList.contains("show")){
                fecharToggle();
            }
        })

        window.addEventListener("keydown", (e)=>{
            if(e.key === "Escape" && menuNavbar.classList.contains("show")){
                fecharToggle();
            }
        })
