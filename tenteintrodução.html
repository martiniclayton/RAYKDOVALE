<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    main{
        display: flex;
        width: 100%;
        height: 100vh;
        background-image: url(img/ChatGPT\ Image\ 26_07_2026\,\ 21_40_27.png);
        justify-content: center;
        align-items: center;
    }
    
    .overlay{
        width: 100%;
        height: 100%;
        background-color: black;
        animation: eaa 10s ease;
        z-index: 99;
    }

    @keyframes eaa {
        0%{
            background-color: rgba(0, 0, 0, 1);
        }
        100%{
            background-color: rgba(0, 0, 0, 0);
        }
        
    }

    img{
        position: absolute;
        animation: entrada 5s ease;
        transition: .3s ease;
        z-index: 100;
        top: 13px;
        left: 48px;
        width: 250px;
    }

    @keyframes entrada {
        0%{
            width: 500px;
            opacity: 0;
            top: 50%;
            left: 50%;
        }
        50%{
            opacity: 1;
        }
        100%{
            top: 13px;
            left: 48px;
        }
    }
</style>
<body>
    <main>
        <div class="overlay"></div>
        <img src="img/logoBranco.png" width="400" alt="">
    </main>
</body>
</html>
